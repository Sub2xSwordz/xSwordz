<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xSwordz</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,Arial,sans-serif;
  background:#050505;
  color:#fff;
}
#stars{
  position:fixed;inset:0;width:100%;height:100%;
  background:#050505;z-index:-3
}
.noise{
  position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.13;
  background-image:radial-gradient(rgba(255,255,255,.7) .6px,transparent .7px);
  background-size:4px 4px;
  mix-blend-mode:screen;
}
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:-2;
  background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.35) 65%,#000 100%);
}

#enter{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:#050505;
  cursor:pointer;
  transition:opacity .6s ease,visibility .6s ease;
}
#enter.hide{opacity:0;visibility:hidden;pointer-events:none}
.enter-box{text-align:center}
.enter-title{
  font-size:13px;letter-spacing:6px;text-transform:uppercase;
  color:#eee;text-shadow:0 0 14px #fff;
}
.enter-sub{margin-top:12px;color:#666;font-size:11px;letter-spacing:2px}
.enter-line{
  width:80px;height:1px;background:#777;margin:18px auto;
  box-shadow:0 0 12px #fff
}

.page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;opacity:0;transform:scale(.985);
  transition:opacity .7s ease,transform .7s ease;
}
.page.show{opacity:1;transform:scale(1)}
.profile{width:min(430px,94vw);text-align:center}

.avatar-wrap{
  width:112px;height:112px;margin:0 auto 20px;
  border-radius:50%;padding:3px;
  background:linear-gradient(145deg,#fff,#333 45%,#fff);
  box-shadow:0 0 18px rgba(255,255,255,.35),0 0 55px rgba(255,255,255,.08);
}
.avatar{
  width:100%;height:100%;border-radius:50%;object-fit:cover;
  display:block;border:2px solid #050505;
}

.username{
  margin:0;font-size:34px;font-weight:700;letter-spacing:-1px;
  text-shadow:0 0 8px #fff,0 0 25px rgba(255,255,255,.3)
}
.subtitle{
  margin-top:9px;color:#8b8b8b;font-size:12px;
  letter-spacing:3px;text-transform:uppercase
}
.uid{
  margin-top:10px;color:#555;font-size:10px;letter-spacing:1.5px
}

.bio{
  margin:22px auto 20px;color:#aaa;font-size:13px
}
.bio span{color:#fff}

.links{
  display:flex;justify-content:center;gap:10px;margin:18px 0
}
.link{
  width:43px;height:43px;border-radius:12px;
  display:grid;place-items:center;text-decoration:none;
  color:#fff;background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 14px rgba(255,255,255,.04);
  transition:.2s ease
}
.link:hover{
  transform:translateY(-3px);border-color:rgba(255,255,255,.45);
  box-shadow:0 0 20px rgba(255,255,255,.13)
}
.link svg{width:20px;height:20px;fill:#fff}

.views{color:#777;font-size:11px;margin:16px 0 20px}
.eye{display:inline-block;width:13px;height:8px;border:1px solid #aaa;
border-radius:90% 10%;transform:rotate(45deg);margin-right:7px;vertical-align:1px}
.eye:after{content:"";display:block;width:3px;height:3px;background:#aaa;border-radius:50%;margin:1.5px 0 0 4px}

.player{
  width:100%;padding:13px 15px;display:grid;
  grid-template-columns:42px 1fr 28px;gap:11px;align-items:center;
  border:1px solid rgba(255,255,255,.12);border-radius:16px;
  background:rgba(255,255,255,.035);backdrop-filter:blur(10px);
  box-shadow:0 0 28px rgba(255,255,255,.035)
}
.play,.mute{
  border:0;background:transparent;color:#fff;cursor:pointer;
  text-shadow:0 0 8px #fff
}
.play{width:36px;height:36px;border:1px solid #333;border-radius:50%;background:#111}
.top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px}
.song{color:#eee}.time{color:#666}
.track{height:3px;background:#222;border-radius:10px;cursor:pointer}
.progress{height:100%;width:0;background:#fff;border-radius:10px;box-shadow:0 0 8px #fff}

.footer{
  margin-top:20px;color:#555;font-size:10px;letter-spacing:4px;
  text-transform:uppercase
}
.footer:before,.footer:after{
  content:"";display:inline-block;width:35px;height:1px;
  background:#444;vertical-align:middle;margin:0 12px
}

@media(max-width:520px){
  .avatar-wrap{width:96px;height:96px}
  .username{font-size:30px}
}
</style>
</head>

<script>
const canvas=document.getElementById("stars"),ctx=canvas.getContext("2d");
let stars=[];
function resize(){
  canvas.width=innerWidth;canvas.height=innerHeight;
  stars=Array.from({length:Math.floor(innerWidth*innerHeight/6000)},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.2+.15,a:Math.random()*.75+.15,s:Math.random()*.25+.03
  }));
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){
    s.y+=s.s;if(s.y>innerHeight)s.y=-2;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.fill();
  }
  requestAnimationFrame(draw);
}
addEventListener("resize",resize);resize();draw();

const enter=document.getElementById("enter"),page=document.getElementById("page");
enter.addEventListener("click",()=>{enter.classList.add("hide");page.classList.add("show");});

const audio=document.getElementById("audio"),play=document.getElementById("play");
const progress=document.getElementById("progress"),track=document.getElementById("track");
const current=document.getElementById("current"),duration=document.getElementById("duration"),mute=document.getElementById("mute");

function fmt(s){if(!Number.isFinite(s))return"0:00";return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
audio.addEventListener("loadedmetadata",()=>duration.textContent=fmt(audio.duration));
audio.addEventListener("timeupdate",()=>{
  current.textContent=fmt(audio.currentTime);
  progress.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+"%";
});
audio.addEventListener("play",()=>play.textContent="Ⅱ");
audio.addEventListener("pause",()=>play.textContent="▶");
play.onclick=()=>audio.paused?audio.play():audio.pause();
mute.onclick=()=>{audio.muted=!audio.muted;mute.textContent=audio.muted?"×":"♪"};
track.onclick=e=>{
  if(!audio.duration)return;
  const r=track.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
};
</script>
